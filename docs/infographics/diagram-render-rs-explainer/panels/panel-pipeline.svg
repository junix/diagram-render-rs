<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="236" viewBox="0 0 1120 236" aria-labelledby="pt" role="img"><title id="pt">渲染管线：从源文本到 SVG 与 PNG</title><g font-family="system-ui, -apple-system, 'PingFang SC', sans-serif"><text x="16.0" y="26.0" font-size="15" fill="#101826" text-anchor="start" font-weight="600">渲染管线：解析在左、渲染在右，场景原语是两者的边界</text><text x="16.0" y="46.0" font-size="11.5" fill="#6b7690" text-anchor="start" font-weight="normal">数据库模式 · 时序波形 · 架构模型 · 分类图 · 几何场景，七种语言在此汇入同一条降维路径</text><rect x="16.0" y="86" width="168" height="62" rx="8" fill="#ffffff" stroke="#c9d6ea" stroke-width="1.2"/><text x="100.0" y="113.0" font-size="13" fill="#101826" text-anchor="middle" font-weight="600">源文本</text><text x="100.0" y="133.0" font-size="10.5" fill="#6b7690" text-anchor="middle" font-weight="normal">七种 DSL 之一</text><line x1="186.0" y1="117.0" x2="196.0" y2="117.0" stroke="#8fa3c4" stroke-width="1.6"/><polygon points="196.0,113.0 196.0,121.0 202.0,117.0" fill="#8fa3c4"/><rect x="200.0" y="86" width="168" height="62" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/><text x="284.0" y="113.0" font-size="13" fill="#101826" text-anchor="middle" font-weight="600">类型化 AST 文档</text><text x="284.0" y="133.0" font-size="10.5" fill="#6b7690" text-anchor="middle" font-weight="normal">兄弟项目 · 修订锁定</text><line x1="370.0" y1="117.0" x2="380.0" y2="117.0" stroke="#8fa3c4" stroke-width="1.6"/><polygon points="380.0,113.0 380.0,121.0 386.0,117.0" fill="#8fa3c4"/><rect x="384.0" y="86" width="168" height="62" rx="8" fill="#ffffff" stroke="#c9d6ea" stroke-width="1.2"/><text x="468.0" y="113.0" font-size="13" fill="#101826" text-anchor="middle" font-weight="600">语言布局解释器</text><text x="468.0" y="133.0" font-size="10.5" fill="#6b7690" text-anchor="middle" font-weight="normal">名字·层级·关系</text><line x1="554.0" y1="117.0" x2="564.0" y2="117.0" stroke="#8fa3c4" stroke-width="1.6"/><polygon points="564.0,113.0 564.0,121.0 570.0,117.0" fill="#8fa3c4"/><rect x="568.0" y="86" width