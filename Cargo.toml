[package]
name = "diagram-render-rs"
default-run = "diagram-render-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Render typed diagram ASTs to SVG and PNG"
repository = "https://github.com/junix/diagram-render-rs"
keywords = ["diagram", "ast", "svg", "png", "renderer"]
categories = ["command-line-utilities", "graphics", "visualization"]
publish = false

[lib]
name = "diagram_render_rs"
path = "src/lib.rs"

[[bin]]
name = "diagram-render-rs"
path = "src/main.rs"

[[bin]]
name = "plot-provider-dbml"
path = "src/bin/dbml/main.rs"

[dependencies]
# V1 receipts pin this exact implementation. Keep it independent of evolving
# native CLI/library routing; never retarget the alias without a new contract.
diagram-render-v1 = { package = "diagram-render-rs", git = "https://github.com/junix/diagram-render-rs.git", rev = "8203dbe909d588ad0239f0bd77f9b439f48111e5" }
anyhow = "=1.0.86"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
libc = "=0.2.189"
same-file = "=1.0.6"
clap = { version = "=4.6.6", features = ["derive"] }
diagram-ast-parser = { git = "https://github.com/junix/diagram-ast-parser.git", rev = "1bb33fbd22b6a51580021a157f30e1484221f0f5" }
# The 24-token palette contract shared by the five renderers (ADR-1137). The
# `clap` feature is only the `--theme` value parser; the tables carry no
# runtime dependencies.
diagram-theme = { git = "https://github.com/junix/diagram-theme-rs.git", rev = "0d6530f0ccea5a61b0d2fef9a3e164ff816ca852", features = ["clap"] }
resvg = "=0.48.1"
serde_json = "=1.0.151"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
# Exercise the shared output gate against real SVG/PNG without adding its
# parsers to production builds. Keep the same revision as the runtime palette.
diagram-theme = { git = "https://github.com/junix/diagram-theme-rs.git", rev = "0d6530f0ccea5a61b0d2fef9a3e164ff816ca852", features = ["cli"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
