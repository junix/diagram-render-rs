[package]
name = "diagram-render-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Render typed diagram ASTs to SVG and PNG"
repository = "https://github.com/junix/diagram-render-rs"
keywords = ["diagram", "ast", "svg", "png", "renderer"]
categories = ["command-line-utilities", "graphics", "visualization"]
publish = false

[lib]
name = "diagram_render_rs"
path = "src/lib.rs"

[[bin]]
name = "diagram-render-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
diagram-ast-parser = { git = "https://github.com/junix/diagram-ast-parser.git", rev = "a8540652364157838d8c6398f08d9abfb4efcb93" }
# The 24-token palette contract shared by the five renderers (ADR-1137). The
# `clap` feature is only the `--theme` value parser; the tables carry no
# runtime dependencies.
diagram-theme = { git = "https://github.com/junix/diagram-theme-rs.git", rev = "0d6530f0ccea5a61b0d2fef9a3e164ff816ca852", features = ["clap"] }
resvg = "=0.48.1"
serde_json = "=1.0.151"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
