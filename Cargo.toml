[package]
name = "diagram-render-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Render typed diagram ASTs to SVG and PNG"
repository = "https://github.com/junix/diagram-render-rs"
keywords = ["diagram", "ast", "svg", "png", "renderer"]
categories = ["command-line-utilities", "graphics", "visualization"]
publish = false

[lib]
name = "diagram_render_rs"
path = "src/lib.rs"

[[bin]]
name = "diagram-render-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
diagram-ast-parser = { git = "https://github.com/junix/diagram-ast-parser.git", rev = "f34a45cb9ea60c08a5aa3190874035a6156fe284" }
resvg = "=0.48.1"
serde_json = "=1.0.151"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
